[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochaflow"
version = "0.1.0"
description = "A research project scaffold for stochastic flows and diffusion-family methods."
readme = "README.md"
# Project minimum stays at 3.12 for Intel Mac.
# Other environments can use newer interpreters such as Python 3.14.
requires-python = ">=3.12"
dependencies = [
    # Current PyPI releases no longer publish macOS x86_64 wheels for Intel Macs.
    # Keep Intel Macs on the latest known wheel-backed trio for CPython 3.12 x86_64.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Other platforms can follow the current release line. Windows CUDA wheels are
    # routed through tool.uv.sources below.
    "torch>=2.11,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.26,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tqdm>=4.67.3",
    # Torch 2.2.2 wheels were built against NumPy 1.x on Intel Macs.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.4.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyyaml>=6.0.3",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "tensorboard>=2.16",
    "ruff>=0.15.13",
]

[project.scripts]
stochaflow-train-mnist-ddpm = "stochaflow.scripts.train_mnist_ddpm:main"

[project.optional-dependencies]
wandb = [
    "wandb>=0.17",
]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
]
