[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochaflow"
version = "0.1.0"
description = "A research project scaffold for stochastic flows and diffusion-family methods."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11,<3",
    "torchvision>=0.26,<1",
    "torchmetrics>=1.9,<2",
    "rich>=13.9",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "pillow>=12.2.0",
    "tensorboard>=2.16",
    "packaging>=24",
]

[project.scripts]
stochaflow = "stochaflow.scripts.cli:main"

[project.optional-dependencies]
wandb = [
    "wandb>=0.17",
]
quality = [
    "torch-fidelity>=0.3,<1",
]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff==0.16.0",
]
docs = [
    "matplotlib>=3.10.9",
    "scipy>=1.16.1",
    "sphinx>=9.1,<10",
    "myst-parser>=5.1,<6",
    "furo>=2025.12.19",
    "sphinx-autobuild>=2025.8.25",
    "sphinxcontrib-mermaid>=2.0.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"stochaflow.projects" = ["templates/*.tmpl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.ruff]
required-version = "==0.16.0"
target-version = "py312"
line-length = 88
src = ["src", "examples/extension-projects/*/src"]

[tool.ruff.lint]
select = [
    # Curated strict baseline for a typed framework.
    "B",
    "C4",
    "E",
    "F",
    "I",
    "UP",
    "W291",
    "W292",
    "W293",
    "W605",
    # Additional correctness and modernization checks for a typed framework.
    "ASYNC",
    "BLE",
    "DTZ",
    "ERA",
    "FURB",
    "G",
    "LOG",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "T10",
    "YTT",
    # Selected high-signal rules from otherwise opinionated families.
    "D419",
    "ISC004",
    "PLR0402",
    "PLR1714",
    "S102",
    "S110",
    "S112",
    "TRY002",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY401",
]
ignore = [
    # Ruff's formatter only makes a best effort at line length.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Chinese reference prose intentionally uses full-width Chinese punctuation.
"tests/test_config_reference.py" = ["RUF001"]
"tools/generate_config_reference.py" = ["RUF001"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
]
