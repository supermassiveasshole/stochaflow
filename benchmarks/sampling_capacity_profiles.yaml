version: 1
profiles:
  ci_smoke:
    description: Tiny executable contract smoke for CI and local development.
    num_samples: 4
    batch_size: 2
    shape: [1, 8, 8]
    dtype: float32
    trajectory_observations: 3
    writers:
      - name: tensor
        params: {}
    execute: true
    warmup_runs: 0
    measured_runs: 1

  field3d_preview:
    description: Executable small 3D field and trajectory workload.
    num_samples: 2
    batch_size: 1
    shape: [4, 64, 64, 64]
    dtype: float32
    trajectory_observations: 5
    writers:
      - name: tensor
        params: {}
    execute: true
    warmup_runs: 1
    measured_runs: 5

  high_resolution_1024_projection:
    description: Projection for sixteen 1024-square RGB samples and 51 states.
    num_samples: 16
    batch_size: 1
    shape: [3, 1024, 1024]
    dtype: float32
    trajectory_observations: 51
    writers:
      - name: tensor
        params: {}
    execute: false
    warmup_runs: 0
    measured_runs: 1

  field3d_dense_projection:
    description: Projection for eight large 3D fields and 51 retained states.
    num_samples: 8
    batch_size: 1
    shape: [4, 128, 128, 128]
    dtype: float32
    trajectory_observations: 51
    writers:
      - name: tensor
        params: {}
    execute: false
    warmup_runs: 0
    measured_runs: 1
