[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochaflow-physics-reconstruction"
version = "0.1.0"
description = "Physics-guided flow reconstruction reference extension for Stochaflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "stochaflow @ https://github.com/supermassiveasshole/stochaflow/releases/download/v0.1.0/stochaflow-0.1.0-py3-none-any.whl",
    "numpy>=1.26",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.entry-points."stochaflow.extensions"]
physics-reconstruction = "stochaflow_physics_reconstruction.stochaflow_ext"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
