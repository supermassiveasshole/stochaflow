experiment:
  name: physics-reconstruction-tiny
  seed: 42
  output_dir: outputs/tiny

extensions:
  plugins: [physics-reconstruction]

data:
  name: physics-reconstruction.kolmogorov-trajectories
  params:
    source:
      name: physics-reconstruction.numpy-trajectories
      params:
        path: data/tiny/trajectories.npy
      materialization:
        cache_root: ./.stochaflow-cache
        policy: ensure
        verification: full
    train_trajectories: [0, 4]
    validation_trajectories: [4, 5]
    test_trajectories: [5, 6]
    loader:
      batch_size: 2
      num_workers: 0
      shuffle: true
      drop_last: true
      pin_memory: false
      persistent_workers: false
      prefetch_factor: null
      steps_per_epoch: auto

model:
  name: physics-reconstruction.conditional-denoiser
  params:
    channels: 3
    hidden_channels: 8
    num_blocks: 1
    time_embedding_dim: 8
    normalization_mean: 0.0
    normalization_scale: 1.0
    reynolds_number: 1000.0
    time_delta: 0.03125
    linear_damping: 0.1
    forcing_wavenumber: 4
    forcing_amplitude: -4.0

training:
  name: physics-reconstruction.gaussian-denoising
  params:
    prediction_type: epsilon
    conditioning_strength: 0.0001

objective:
  name: mse
  params: {reduction: mean}

process:
  name: discrete_gaussian
  params:
    schedule:
      name: linear_beta
      params:
        num_timesteps: 8
        beta_start: 0.0001
        beta_end: 0.02

optimizer:
  name: torch.optim.Adam
  params: {lr: 0.001}

lr_scheduler: null

ema:
  enabled: false

sampling:
  run_after_training: true
  shape: [3, 8, 8]
  num_samples: 4
  batch_size: 2
  seed: 7
  sampler:
    name: ddim
    params: {schedule: [4, 2, 0], eta: 0.0}
  options:
    weights: raw
    clip_denoised: false
    partial_noise_time: 4
    conditioning_strength: 0.0001
    correction_strength: 0.0
    source:
      path: data/tiny/observations.npy
      trajectories: [0, 1]
    reference:
      path: data/tiny/references.npy
      trajectories: [0, 1]
    alignment: data/tiny/alignment.json
    trajectory: {enabled: false, every_steps: 1}
  writers:
    - name: physics-reconstruction.reconstruction-artifacts
      params: {}

diagnostics: []

trainer:
  num_epochs: 1
  device: cpu
  max_grad_norm: 1.0
  show_progress: false

logging:
  log_every: 1
  backends:
    - name: local
      params: {console: false}
  torch_logs: {}

artifacts:
  checkpoint_every: 1
