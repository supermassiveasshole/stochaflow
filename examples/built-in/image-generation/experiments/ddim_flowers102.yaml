# Built-in Flowers102 DDIM training example.
experiment:
  name: ddim_flowers102
  seed: 42
  output_dir: outputs/ddim_flowers102

extensions:
  plugins: []

data:
  name: image
  params:
    source:
      name: torchvision
      params:
        dataset: Flowers102
      materialization:
        cache_root: ./data
        policy: ensure
        verification: full
    image:
      size: [64, 64]
      channels: 3
      normalize: true
      random_horizontal_flip: true
    loader:
      batch_size: 64
      num_workers: 2
      shuffle: true
      drop_last: true
      pin_memory: false
      persistent_workers: false
      steps_per_epoch: auto
    partition:
      mode: official

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 128
    channel_multipliers: [1, 2, 4, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1
    attention_levels: [2, 3]
    attention_heads: 4

process:
  name: discrete_gaussian
  params:
    schedule:
      name: linear_beta
      params:
        num_timesteps: 1000
        beta_start: 1.0e-4
        beta_end: 2.0e-2

training:
  name: gaussian_denoising
  params:
    prediction_type: epsilon

objective:
  name: mse
  params:
    reduction: mean

optimizer:
  name: torch.optim.Adam
  params:
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: warmup_cosine
  interval: step
  params:
    warmup_steps: 150
    total_steps: 3000
    min_lr_ratio: 0.05

ema:
  enabled: true
  decay: 0.999
  update_after_step: 0
  update_every: 1
  use_for_sampling: true

sampling:
  run_after_training: true
  sampler:
    name: ddim
    params: {num_inference_steps: 100, eta: 0.0}
  options:
    weights: auto
    clip_denoised: true
    trajectory: {enabled: false, every_steps: 1}
  shape: [3, 64, 64]
  num_samples: 64
  batch_size: 16
  seed: null
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 8, gif_fps: 8, denormalize: true}

diagnostics:
  - name: diffusion_quality
    params:
      modules: []
      cadence:
        step_every: 100
        artifact_every_epochs: 5
      sampling:
        sample_num: 16
        batch_size: 16
        seed: 123
      use_ema: true
      failure_policy: raise
      samplers:
        - id: ddpm_full
          name: ddpm
          params: {}
          trajectory:
            enabled: true
            every_steps: 100
            gif_fps: 8
        - id: ddim_50
          name: ddim
          params:
            num_inference_steps: 50
            eta: 0.0
          trajectory:
            enabled: true
            every_steps: 5
            gif_fps: 8
      providers:
        step_metrics:
          - name: timestep_bucket_loss
            params: {buckets: 10}
          - name: noise_alignment
            params: {}
          - name: x0_reconstruction
            params: {timesteps: [50, 250, 500, 900]}
        sampler_metrics:
          - name: sample_statistics
            params: {}
          - name: sampling_performance
            params: {}
        denoiser_artifacts:
          - name: reconstruction_panel
            params:
              timesteps: [50, 250, 500, 900]
              max_samples: 16
        sampler_artifacts:
          - name: sample_grid
            params: {nrow: 4}
          - name: trajectory
            params: {}
      reference:
        enabled: false
        every_epochs: 20
        num_real: 2048
        num_fake: 2048
        batch_size: 64
        metrics:
          - name: kid
            params: {subsets: 100, subset_size: 1000}
          - name: fid
            params: {}

trainer:
  num_epochs: 200
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: false
    monitor: train_loss
    mode: min
    patience: 20
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
    - name: tensorboard
      params: {}
  torch_logs: {}

artifacts:
  checkpoint_every: 5
