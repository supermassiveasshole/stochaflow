# Complete DDIM-50 sampling profile for the MNIST checkpoint.
# Both sample profiles use the same EMA weights, seed, and 6x6 sample grid.
sample:
  sampler:
    name: ddim
    params:
      num_inference_steps: 50
      eta: 0.0
  options:
    weights: ema
    clip_denoised: true
    trajectory:
      enabled: true
      every_steps: 10
  shape: [1, 32, 32]
  num_samples: 36
  batch_size: 36
  seed: 123
  writers:
    - name: tensor
      params: {}
    - name: image
      params:
        grid_nrow: 6
        gif_fps: 3
        denormalize: true
