# Built-in MNIST training example.
experiment:
  name: mnist
  seed: 42
  output_dir: outputs/mnist

extensions:
  plugins: []

data:
  name: image
  params:
    source:
      name: torchvision
      params:
        dataset: MNIST
      materialization:
        cache_root: ./data
        policy: ensure
        verification: full
    image:
      size: [32, 32]
      channels: 1
      normalize: true
      random_horizontal_flip: false
    loader:
      batch_size: 128
      num_workers: 2
      shuffle: true
      drop_last: true
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      steps_per_epoch: auto
    partition:
      mode: holdout
      validation_size: 10000

model:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 96
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 3
    time_embedding_dim: 192
    dropout: 0.1
    attention_levels: [2]
    attention_heads: 4

process:
  name: discrete_gaussian
  params:
    schedule:
      name: cosine_alpha_bar
      params:
        num_timesteps: 1000
        s: 0.008
        max_beta: 0.999

training:
  name: gaussian_denoising
  params:
    prediction_type: v

objective:
  name: mse
  params:
    reduction: mean

optimizer:
  name: torch.optim.Adam
  params:
    lr: 0.0003
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: warmup_cosine
  interval: step
  params:
    warmup_steps: 2000
    total_steps: 78000
    min_lr_ratio: 0.05

ema:
  enabled: true
  decay: 0.9995
  update_after_step: 100
  update_every: 1

diagnostics:
  - name: diffusion_quality
    params:
      modules: []
      cadence:
        step_every: 100
        artifact_every_epochs: 10
      sampling:
        shape: [1, 32, 32]
        sample_num: 32
        batch_size: 32
        seed: 123
      use_ema: true
      failure_policy: warn
      samplers:
        - id: ddim_50
          name: ddim
          params:
            num_inference_steps: 50
            eta: 0.0
          trajectory:
            enabled: false
            every_steps: 5
            gif_fps: 8
      providers:
        step_metrics:
          - name: timestep_bucket_loss
            params: {buckets: 10}
          - name: noise_alignment
            params: {}
          - name: x0_reconstruction
            params:
              timesteps: [50, 250, 500, 750, 900]
        sampler_metrics:
          - name: sample_statistics
            params: {}
          - name: sampling_performance
            params: {}
        denoiser_artifacts:
          - name: reconstruction_panel
            params:
              timesteps: [100, 500, 900]
              max_samples: 8
        sampler_artifacts:
          - name: sample_grid
            params: {nrow: 8}
      reference:
        enabled: false

trainer:
  num_epochs: 200
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: false
    monitor: valid_loss
    mode: min
    patience: 7
    min_delta: 0.00001

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
    - name: tensorboard
      params: {}
  torch_logs: {}

artifacts:
  checkpoint_every: 50
