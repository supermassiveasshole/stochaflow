experiment:
  name: afhq_v2_adm_128_learned_range_v
  seed: 20260726
  output_dir: outputs/afhq-v2/adm-128-learned-range-v

extensions:
  plugins: [stochaflow-afhq-v2]

data:
  name: class_labeled_image
  params:
    source:
      name: afhq-v2.official
      materialization:
        cache_root: ./data
        policy: require
        verification: manifest
      params:
        resolution: 128
    partition:
      validation_per_class: 300
      seed: stochaflow-afhq-v2-validation-v1
    image:
      size: [128, 128]
      channels: 3
      normalize: true
      random_horizontal_flip: true
    loader:
      batch_size: 8
      num_workers: 2
      shuffle: true
      drop_last: true
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      steps_per_epoch: auto

model:
  name: adm_unet
  params:
    input_size: 128
    in_channels: 3
    out_channels: 6
    base_channels: 128
    channel_multipliers: [1, 2, 3, 4]
    num_res_blocks: 2
    attention_resolutions: [32, 16]
    attention_head_channels: 64
    num_classes: 3
    dropout: 0.1

process:
  name: discrete_gaussian
  params:
    schedule:
      name: cosine_alpha_bar
      params:
        num_timesteps: 1000
        s: 0.008
        max_beta: 0.999

training:
  name: class_conditional_gaussian_denoising
  params:
    prediction_type: v
    variance:
      mode: learned_range
    condition_dropout: 0.1

objective:
  name: mse
  params:
    reduction: mean

metrics:
  - id: prediction_mae
    name: mae
    channel: gaussian.prediction_target
    phases: [validation]
    params: {}
  - id: clean_reconstruction_mse
    name: mse
    channel: gaussian.clean_reconstruction
    phases: [validation]
    params: {}

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.0e-4
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: warmup_cosine
  interval: step
  params:
    warmup_steps: 1680
    total_steps: 84000
    min_lr_ratio: 0.05

ema:
  enabled: true
  decay: 0.9999
  update_after_step: 500
  update_every: 1

diagnostics:
  - name: class_conditional_diffusion_quality
    params:
      conditions:
        - {class_label: 0, count: 4}
        - {class_label: 1, count: 4}
        - {class_label: 2, count: 4}
      guidance_scale: 2.0
      modules: []
      cadence:
        step_every: 1000
        artifact_every_epochs: 10
      sampling:
        shape: [3, 128, 128]
        sample_num: 12
        batch_size: 6
        seed: 20260726
      use_ema: true
      failure_policy: warn
      samplers:
        - id: ddpm_100
          name: ddpm
          params:
            num_inference_steps: 100
          trajectory:
            enabled: false
            every_steps: 10
            gif_fps: 8
        - id: ddim_50
          name: ddim
          params:
            num_inference_steps: 50
            eta: 0.0
          trajectory:
            enabled: false
            every_steps: 5
            gif_fps: 8
      providers:
        step_metrics:
          - name: timestep_bucket_loss
            params: {buckets: 10}
          - name: noise_alignment
            params: {}
          - name: x0_reconstruction
            params:
              timesteps: [50, 250, 500, 750, 900]
        sampler_metrics:
          - name: sample_statistics
            params: {}
          - name: sampling_performance
            params: {}
        denoiser_artifacts:
          - name: reconstruction_panel
            params:
              timesteps: [100, 500, 900]
              max_samples: 4
        sampler_artifacts:
          - name: sample_grid
            params: {nrow: 4}
      reference:
        enabled: false

trainer:
  num_epochs: 200
  device: cuda
  precision: bf16-mixed
  accumulate_grad_batches: 4
  max_grad_norm: 1.0
  show_progress: true
  test_after_fit: false
  early_stopping:
    enabled: false
    monitor: valid/metrics/distribution/aggregate.fid
    mode: min
    patience: 20
    min_delta: 0.0
  validation_evaluation:
    enabled: true
    start_epoch: 100
    every_epochs: 10
    include_final: true
    weights: ema
    evaluation:
      name: afhq-v2.class-conditional-generation
      params:
        class_mapping: {cat: 0, dog: 1, wild: 2}
        expected_per_class: {cat: 300, dog: 300, wild: 300}
        sampling:
          recipe:
            name: class_conditional_denoising
            contract:
              prediction_type: v
              variance: {mode: learned_range}
          sampler:
            name: ddpm
            params:
              num_inference_steps: 100
          options:
            weights: ema
            clip_denoised: true
            guidance_scale: 2.0
            conditions:
              - {class_label: 0, count: 300}
              - {class_label: 1, count: 300}
              - {class_label: 2, count: 300}
            trajectory:
              enabled: false
              every_steps: 10
          shape: [3, 128, 128]
          num_samples: 900
          batch_size: 15
          seed: 20260726
        gallery_count: 12
    metrics:
      - id: distribution
        name: afhq-v2.class-aware-distribution
        channel: afhq-v2.image-pairs
        params:
          class_mapping: {cat: 0, dog: 1, wild: 2}
          expected_real: {cat: 300, dog: 300, wild: 300}
          expected_fake: {cat: 300, dog: 300, wild: 300}
          providers:
            - name: kid
              params:
                feature: 2048
                antialias: true
                subsets: 100
                subset_size: 200
                degree: 3
                coef: 1.0
                seed: 20260726
            - name: fid
              params:
                feature: 2048
                antialias: true
    metric_keys:
      - valid/metrics/distribution/aggregate.fid
      - valid/metrics/distribution/aggregate.kid_mean
      - valid/metrics/distribution/aggregate.kid_std
      - valid/metrics/distribution/cat.fid
      - valid/metrics/distribution/cat.kid_mean
      - valid/metrics/distribution/cat.kid_std
      - valid/metrics/distribution/dog.fid
      - valid/metrics/distribution/dog.kid_mean
      - valid/metrics/distribution/dog.kid_std
      - valid/metrics/distribution/wild.fid
      - valid/metrics/distribution/wild.kid_mean
      - valid/metrics/distribution/wild.kid_std
    protocol:
      id: afhq-v2-adm-learned-range-v-ddpm100-validation-v1
      expected_examples: 900
      strict_complete: true

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
    - name: tensorboard
      params: {}
  torch_logs: {}

artifacts:
  checkpoint_every: 50
