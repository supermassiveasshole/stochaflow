sample:
  sampler:
    name: ddim
    params:
      num_inference_steps: 2
      eta: 0.0
  options:
    weights: ema
    clip_denoised: true
    guidance_scale: 2.0
    conditions:
      - {class_label: 0, count: 1}
      - {class_label: 1, count: 1}
      - {class_label: 2, count: 1}
    trajectory:
      enabled: false
      every_steps: 1
  shape: [3, 128, 128]
  num_samples: 3
  batch_size: 3
  seed: 20260726
  writers:
    - name: tensor
      params: {}
    - name: image
      params:
        grid_nrow: 3
        gif_fps: 8
        denormalize: true
