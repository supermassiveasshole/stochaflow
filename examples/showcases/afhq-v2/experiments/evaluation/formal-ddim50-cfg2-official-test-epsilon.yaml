version: 1
name: afhq-v2-adm-epsilon-ddim50-cfg2-official-test-v1
purpose: final_test

extensions:
  plugins: [stochaflow-afhq-v2]

# Fail closed until validation selection has frozen one production epoch EMA.
# Replace both placeholders with the production run ID and exact zero-padded
# selected checkpoint filename (for example epoch_0120.pt). Never point this
# one-shot profile at best.pt or an old controlled-A/B latest.pt alias.
subject:
  kind: checkpoint
  path: ../../../../../outputs/afhq-v2/adm-128-p2/REPLACE_WITH_RUN_ID/checkpoints/REPLACE_WITH_SELECTED_EPOCH_CHECKPOINT.pt
  weights: ema

data:
  source: checkpoint
  split: test

evaluation:
  name: afhq-v2.class-conditional-generation
  params:
    class_mapping: {cat: 0, dog: 1, wild: 2}
    expected_per_class: {cat: 493, dog: 491, wild: 483}
    sampling:
      recipe:
        name: class_conditional_denoising
        contract:
          prediction_type: epsilon
          variance: {mode: fixed}
      sampler:
        name: ddim
        params:
          num_inference_steps: 50
          eta: 0.0
      options:
        weights: ema
        clip_denoised: true
        guidance_scale: 2.0
        conditions:
          - {class_label: 0, count: 493}
          - {class_label: 1, count: 491}
          - {class_label: 2, count: 483}
        trajectory:
          enabled: false
          every_steps: 5
      shape: [3, 128, 128]
      num_samples: 1467
      batch_size: 30
      seed: 20260726
    gallery_count: 12

metrics:
  - id: distribution
    name: afhq-v2.class-aware-distribution
    channel: afhq-v2.image-pairs
    params:
      class_mapping: {cat: 0, dog: 1, wild: 2}
      expected_real: {cat: 493, dog: 491, wild: 483}
      expected_fake: {cat: 493, dog: 491, wild: 483}
      providers:
        - name: kid
          params:
            feature: 2048
            subsets: 100
            subset_size: 300
            degree: 3
            coef: 1.0
            seed: 20260726
        - name: fid
          params:
            feature: 2048
            antialias: true

protocol:
  id: afhq-v2-adm-epsilon-ddim50-cfg2-official-test-v1
  expected_examples: 1467
  strict_complete: true
