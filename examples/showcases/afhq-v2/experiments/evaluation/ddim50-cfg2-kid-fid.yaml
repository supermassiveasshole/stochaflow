extensions:
  plugins: [stochaflow-afhq-v2]

sampling:
  sampler:
    name: ddim
    params:
      num_inference_steps: 50
      eta: 0.0
  options:
    weights: ema
    clip_denoised: true
    guidance_scale: 2.0
    conditions:
      - {class_label: 0, count: 300}
      - {class_label: 1, count: 300}
      - {class_label: 2, count: 300}
    trajectory:
      enabled: false
      every_steps: 5
  shape: [3, 128, 128]
  num_samples: 900
  batch_size: 30
  seed: 20260726
  writers:
    - name: tensor
      params: {}

evaluation:
  schema_version: 1
  split: test
  class_mapping: {cat: 0, dog: 1, wild: 2}
  real_per_class: 300
  fake_per_class: 300
  metric_batch_size: 30
  metric_seed: 20260726
  metrics:
    - name: kid
      params:
        subsets: 100
        subset_size: 300
    - name: fid
      params:
        feature: 2048
