experiment:
  name: afhq_v2_adm_128_smoke
  seed: 20260726
  output_dir: outputs/afhq-v2/smoke

extensions:
  plugins: [stochaflow-afhq-v2]

data:
  name: class_labeled_image
  params:
    source:
      name: afhq-v2.official
      materialization:
        cache_root: ./data
        policy: require
        verification: full
      params:
        resolution: 128
    partition:
      validation_per_class: 300
      seed: stochaflow-afhq-v2-validation-v1
    image:
      size: [128, 128]
      channels: 3
      normalize: true
      random_horizontal_flip: true
    loader:
      batch_size: 2
      num_workers: 0
      shuffle: true
      drop_last: true
      pin_memory: false
      persistent_workers: false
      prefetch_factor: null
      steps_per_epoch: 4

model:
  name: adm_unet
  params:
    input_size: 128
    in_channels: 3
    out_channels: 3
    base_channels: 32
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    attention_resolutions: [64]
    attention_head_channels: 32
    num_classes: 3
    dropout: 0.0

process:
  name: discrete_gaussian
  params:
    schedule:
      name: linear_beta
      params:
        num_timesteps: 8
        beta_start: 1.0e-4
        beta_end: 0.02

training:
  name: class_conditional_gaussian_denoising
  params:
    prediction_type: v
    condition_dropout: 0.1

objective:
  name: mse
  params:
    reduction: mean

metrics:
  - id: prediction_mae
    name: mae
    channel: gaussian.prediction_target
    phases: [validation, test]
    params: {}
  - id: clean_reconstruction_mse
    name: mse
    channel: gaussian.clean_reconstruction
    phases: [validation, test]
    params: {}

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.0e-4
    weight_decay: 0.0

lr_scheduler:
  name: warmup_cosine
  interval: step
  params:
    warmup_steps: 1
    total_steps: 2
    min_lr_ratio: 0.1

ema:
  enabled: true
  decay: 0.99
  update_after_step: 0
  update_every: 1

diagnostics:
  - name: class_conditional_diffusion_quality
    params:
      conditions:
        - {class_label: 0, count: 1}
        - {class_label: 1, count: 1}
        - {class_label: 2, count: 1}
      guidance_scale: 2.0
      modules: []
      cadence:
        step_every: 1
        artifact_every_epochs: 1
      sampling:
        shape: [3, 128, 128]
        sample_num: 3
        batch_size: 3
        seed: 20260726
      use_ema: true
      failure_policy: raise
      samplers:
        - id: ddim_2
          name: ddim
          params:
            num_inference_steps: 2
            eta: 0.0
          trajectory:
            enabled: false
            every_steps: 1
            gif_fps: 4
      providers:
        step_metrics:
          - name: timestep_bucket_loss
            params: {buckets: 2}
          - name: noise_alignment
            params: {}
          - name: x0_reconstruction
            params: {timesteps: [4]}
        sampler_metrics:
          - name: sample_statistics
            params: {}
          - name: sampling_performance
            params: {}
        denoiser_artifacts:
          - name: reconstruction_panel
            params:
              timesteps: [4]
              max_samples: 1
        sampler_artifacts:
          - name: sample_grid
            params: {nrow: 3}
      reference:
        enabled: false

trainer:
  num_epochs: 1
  device: cpu
  precision: fp32
  accumulate_grad_batches: 2
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: false
    monitor: valid/loss

logging:
  log_every: 1
  backends:
    - name: local
      params:
        console: true
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 1
