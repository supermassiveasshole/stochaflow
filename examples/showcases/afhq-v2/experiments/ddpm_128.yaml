experiment:
  name: ddpm_afhq_v2_128
  seed: 42
  output_dir: outputs/ddpm_afhq_v2_128

extensions:
  plugins: [stochaflow-afhq-v2]

data:
  name: image
  params:
    source:
      name: afhq-v2.official
      params:
        resolution: 128
        validation_per_class: 300
        validation_seed: stochaflow-afhq-v2-validation-v1
      materialization:
        cache_root: ./data
        policy: ensure
        verification: full
    image:
      size: [128, 128]
      channels: 3
      normalize: true
      random_horizontal_flip: true
    loader:
      batch_size: 16
      num_workers: 2
      shuffle: true
      drop_last: true
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      steps_per_epoch: auto
    partition:
      mode: official

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 96
    channel_multipliers: [1, 2, 3, 4]
    num_res_blocks: 2
    time_embedding_dim: 256
    dropout: 0.1
    attention_levels: [3]
    attention_heads: 4

process:
  name: discrete_gaussian
  params:
    schedule:
      name: cosine_alpha_bar
      params:
        num_timesteps: 1000
        s: 0.008
        max_beta: 0.999

training:
  name: gaussian_denoising
  params:
    prediction_type: v

objective:
  name: mse
  params:
    reduction: mean

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 0.0002
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: warmup_cosine
  interval: step
  params:
    warmup_steps: 5000
    total_steps: 167800
    min_lr_ratio: 0.05

ema:
  enabled: true
  decay: 0.9999
  update_after_step: 500
  update_every: 1
  use_for_sampling: true

sampling:
  shape: [3, 128, 128]
  num_samples: 16
  batch_size: 8
  seed: 123
  builder:
    name: standard_denoising
    params:
      weights: auto
      prediction_type: v
      clip_denoised: true
      sampler:
        name: ddim
        params:
          num_inference_steps: 100
          eta: 0.0
      trajectory:
        enabled: false
        every_steps: 10
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 4, gif_fps: 8, denormalize: true}

diagnostics:
  - name: diffusion_quality
    params:
      modules: []
      cadence:
        step_every: 200
        artifact_every_epochs: 10
      sampling:
        sample_num: 16
        batch_size: 8
        seed: 123
      use_ema: true
      failure_policy: warn
      samplers:
        - id: ddim_50
          name: ddim
          params:
            num_inference_steps: 50
            eta: 0.0
          trajectory:
            enabled: false
            every_steps: 5
            gif_fps: 8
      providers:
        step_metrics:
          - name: timestep_bucket_loss
            params: {buckets: 10}
          - name: noise_alignment
            params: {}
          - name: x0_reconstruction
            params:
              timesteps: [50, 250, 500, 750, 900]
        sampler_metrics:
          - name: sample_statistics
            params: {}
          - name: sampling_performance
            params: {}
        denoiser_artifacts:
          - name: reconstruction_panel
            params:
              timesteps: [100, 500, 900]
              max_samples: 4
        sampler_artifacts:
          - name: sample_grid
            params: {nrow: 4}
      reference:
        enabled: false

trainer:
  num_epochs: 200
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: false
    monitor: valid_loss
    mode: min
    patience: 20
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
    - name: tensorboard
      params: {}
  torch_logs: {}

artifacts:
  checkpoint_every: 10
