[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochaflow-afhq-v2"
version = "0.1.0"
description = "End-to-end class-conditional AFHQ-v2 generation showcase."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "stochaflow @ https://github.com/supermassiveasshole/stochaflow/releases/download/v0.1.0/stochaflow-0.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
quality = [
    "stochaflow[quality] @ https://github.com/supermassiveasshole/stochaflow/releases/download/v0.1.0/stochaflow-0.1.0-py3-none-any.whl",
]

[project.scripts]
stochaflow-afhq-v2-prepare = "stochaflow_afhq_v2.tools.prepare:main"
stochaflow-afhq-v2-capacity = "stochaflow_afhq_v2.tools.capacity:main"

[project.entry-points."stochaflow.extensions"]
stochaflow-afhq-v2 = "stochaflow_afhq_v2.stochaflow_ext"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
stochaflow_afhq_v2 = ["resources/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
stochaflow = { path = "../../..", editable = true }
