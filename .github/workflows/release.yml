name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.11.26"

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must equal ${expected_tag}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Release commit ${GITHUB_SHA} is not on origin/main"
            exit 1
          fi
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=release-dists-${GITHUB_REF_NAME}-${GITHUB_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      - name: Run release gates
        run: |
          uv run --frozen ruff check .
          uv run --frozen pyright
          uv run --frozen python tools/generate_config_reference.py --check
          uv run --frozen pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify both distributions are installable
        shell: bash
        run: |
          package_version="$(uv version --short)"
          wheel="dist/stochaflow-${package_version}-py3-none-any.whl"
          sdist="dist/stochaflow-${package_version}.tar.gz"
          test -f "${wheel}"
          test -f "${sdist}"
          test "$(
            find dist -maxdepth 1 -type f -name "stochaflow-*" | wc -l
          )" -eq 2

          wheel_environment="${RUNNER_TEMP}/stochaflow-wheel"
          sdist_environment="${RUNNER_TEMP}/stochaflow-sdist"
          uv venv "${wheel_environment}" --python 3.12
          uv pip install \
            --python "${wheel_environment}/bin/python" \
            "${wheel}"
          test "$(
            "${wheel_environment}/bin/python" -c \
              'from importlib.metadata import version; print(version("stochaflow"))'
          )" = "${package_version}"
          "${wheel_environment}/bin/stochaflow" --help

          uv venv "${sdist_environment}" --python 3.12
          uv pip install \
            --python "${sdist_environment}/bin/python" \
            "${sdist}"
          test "$(
            "${sdist_environment}/bin/python" -c \
              'from importlib.metadata import version; print(version("stochaflow"))'
          )" = "${package_version}"
          "${sdist_environment}/bin/stochaflow" --help

          if tar -tzf "${sdist}" | grep "/tests/" >/dev/null; then
            echo "::error::Install-oriented source distribution contains tests"
            exit 1
          fi

          (
            cd dist
            sha256sum \
              "stochaflow-${package_version}-py3-none-any.whl" \
              "stochaflow-${package_version}.tar.gz" \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/
          digest-mismatch: error

      - name: Verify downloaded distributions
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        shell: bash
        run: |
          test -f "dist/stochaflow-${PACKAGE_VERSION}-py3-none-any.whl"
          test -f "dist/stochaflow-${PACKAGE_VERSION}.tar.gz"
          test -f "dist/SHA256SUMS"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Verify release tag still targets this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag_commit="$(
            gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha
          )"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${tag_commit}"
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        shell: bash
        run: |
          tag_commit="$(
            gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha
          )"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${tag_commit}"
            exit 1
          fi

          release_rows="$(
            gh api --paginate "repos/${GH_REPO}/releases?per_page=100" |
              jq -r --arg tag "${GITHUB_REF_NAME}" \
                '.[] | select(.tag_name == $tag) | [.id, .draft] | @tsv'
          )"
          releases=()
          if [[ -n "${release_rows}" ]]; then
            mapfile -t releases <<< "${release_rows}"
          fi
          if (( ${#releases[@]} > 1 )); then
            echo "::error::Multiple releases use tag ${GITHUB_REF_NAME}"
            exit 1
          fi

          release_download_dir="${RUNNER_TEMP}/release-assets-${GITHUB_RUN_ATTEMPT}"
          download_release_assets() {
            mkdir -p "${release_download_dir}"
            gh release download "${GITHUB_REF_NAME}" \
              --dir "${release_download_dir}"
            test "$(
              find "${release_download_dir}" -maxdepth 1 -type f | wc -l
            )" -eq 3
            (
              cd "${release_download_dir}"
              sha256sum --check SHA256SUMS
            )
          }
          verify_download_matches_build() {
            cmp --silent \
              "dist/stochaflow-${PACKAGE_VERSION}-py3-none-any.whl" \
              "${release_download_dir}/stochaflow-${PACKAGE_VERSION}-py3-none-any.whl"
            cmp --silent \
              "dist/stochaflow-${PACKAGE_VERSION}.tar.gz" \
              "${release_download_dir}/stochaflow-${PACKAGE_VERSION}.tar.gz"
            cmp --silent \
              "dist/SHA256SUMS" \
              "${release_download_dir}/SHA256SUMS"
          }
          verify_download_attestations() {
            local asset
            for asset in \
              "stochaflow-${PACKAGE_VERSION}-py3-none-any.whl" \
              "stochaflow-${PACKAGE_VERSION}.tar.gz" \
              "SHA256SUMS"; do
              gh attestation verify "${release_download_dir}/${asset}" \
                --repo "${GH_REPO}" \
                --signer-workflow "${GH_REPO}/.github/workflows/release.yml" \
                --source-digest "${GITHUB_SHA}" \
                --source-ref "${GITHUB_REF}" \
                --deny-self-hosted-runners >/dev/null
            done
          }

          release_is_draft=""
          if (( ${#releases[@]} == 1 )); then
            IFS=$'\t' read -r release_id release_is_draft <<< "${releases[0]}"
          fi
          if [[ "${release_is_draft}" == "false" ]]; then
            download_release_assets
            verify_download_attestations
            exit 0
          fi

          if (( ${#releases[@]} == 0 )); then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              --title "Stochaflow ${GITHUB_REF_NAME}"
          fi

          gh release upload "${GITHUB_REF_NAME}" \
            "dist/stochaflow-${PACKAGE_VERSION}-py3-none-any.whl#Universal wheel" \
            "dist/stochaflow-${PACKAGE_VERSION}.tar.gz#Source distribution" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --clobber
          download_release_assets
          verify_download_matches_build

          tag_commit="$(
            gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha
          )"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} moved from ${GITHUB_SHA} to ${tag_commit}"
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            --verify-tag \
            --target "${GITHUB_SHA}"
