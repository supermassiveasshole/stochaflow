experiment:
  name: ddpm_mnist
  seed: 42
  output_dir: outputs/ddpm_mnist

extensions:
  modules: []

data:
  name: multi_resolution_image
  params:
    datasets:
    - id: mnist
      factory: mnist
      params:
        root: ./data
        download: true
      splits:
        train: train
        test: test
    image:
      channels: 1
      normalize: true
    batching:
      buckets:
      - name: square_32
        height: 32
        width: 32
      base_bucket: square_32
      dynamic_batch_size: true
    dataloader:
      batch_size: 128
      num_workers: 0
      shuffle: true
      drop_last: true
      pin_memory: false
      persistent_workers: false
      steps_per_epoch: auto
    splits:
      mode: random_holdout
      validation_size: 10000

model:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 64
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

diffusion:
  name: ddpm
  noise_schedule:
    name: linear_beta
    params:
      num_timesteps: 1000
      beta_start: 0.0001
      beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0002
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: cosine
  interval: epoch
  params:
    T_max: auto
    eta_min: 0.00002

ema:
  enabled: true
  decay: 0.9995
  update_after_step: 100
  update_every: 1
  use_for_sampling: true

sampling:
  sampler:
    name: ddim
    params:
      num_inference_steps: 100
      eta: 0.0
  shape: [1, 32, 32]
  num_samples: 64
  batch_size: 64
  seed: null
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 8, gif_fps: 8, denormalize: true}
  debug:
    trajectory:
      enabled: true
      params:
        step_interval: 5

trainer:
  num_epochs: 30
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 7
    min_delta: 0.00001

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
