experiment:
  name: ddpm_mnist
  output_dir: outputs/ddpm_mnist
  seed: 42

data:
  dataset: mnist
  root: ./data
  image_size: 32
  channels: 1
  batch_size: 128
  num_workers: 4

model:
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  num_res_blocks: 2
  attention_resolutions: [16]
  dropout: 0.1
  time_embedding_dim: 256

diffusion:
  type: ddpm
  timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  objective: pred_noise

training:
  epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  ema_decay: 0.999
  log_every: 100
  sample_every: 1
  save_every: 1
