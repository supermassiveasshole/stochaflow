experiment:
  name: ddpm_mnist
  seed: 42
  output_dir: outputs/ddpm_mnist

data:
  dataset:
    name: mnist
    params:
      root: ./data
      split: train
      image_size: 32
      channels: 1
      download: true
      normalize: true
  dataloader:
    batch_size: 128
    num_workers: 4
    shuffle: true
    drop_last: true
    pin_memory: true
    persistent_workers: true

model:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 64
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

diffusion:
  name: ddpm
  scheduler:
    name: linear_ddpm
    params:
      num_timesteps: 1000
      beta_start: 0.0001
      beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0002
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

trainer:
  num_epochs: 20
  device: auto
  max_grad_norm: 1.0
  show_progress: true

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: true
  torch_logs: {}

artifacts:
  sample_every: 1
  checkpoint_every: 1
