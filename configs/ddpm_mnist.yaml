experiment:
  name: ddpm_mnist
  seed: 42
  output_dir: outputs/ddpm_mnist

extensions:
  modules: []

data:
  name: image
  params:
    source:
      kind: torchvision
      dataset: MNIST
      root: ./data
      download: true
    image:
      size: [32, 32]
      channels: 1
      normalize: true
      random_horizontal_flip: false
    loader:
      batch_size: 128
      num_workers: 0
      shuffle: true
      drop_last: true
      pin_memory: false
      persistent_workers: false
      steps_per_epoch: auto
    partition:
      mode: holdout
      validation_size: 10000

model:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 64
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

process:
  name: discrete_gaussian
  params:
    schedule:
      name: linear_beta
      params:
        num_timesteps: 1000
        beta_start: 0.0001
        beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0002
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: cosine
  interval: epoch
  params:
    T_max: auto
    eta_min: 0.00002

ema:
  enabled: true
  decay: 0.9995
  update_after_step: 100
  update_every: 1
  use_for_sampling: true

sampling:
  shape: [1, 32, 32]
  num_samples: 64
  batch_size: 64
  seed: null
  builder:
    name: standard_denoising
    params:
      weights: auto
      prediction_type: epsilon
      clip_denoised: true
      sampler:
        name: ddim
        params:
          num_inference_steps: 100
          eta: 0.0
      trajectory:
        enabled: true
        every_steps: 5
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 8, gif_fps: 8, denormalize: true}

trainer:
  num_epochs: 30
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 7
    min_delta: 0.00001

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
