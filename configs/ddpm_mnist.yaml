experiment:
  name: ddpm_mnist
  seed: 42
  output_dir: outputs/ddpm_mnist

data:
  modules: []
  datasets:
    - id: mnist
      factory: mnist
      params:
        root: ./data
        download: true
      splits:
        train: train
        test: test
  image:
    channels: 1
    normalize: true
  batching:
    buckets:
      - name: square_32
        height: 32
        width: 32
    sample_bucket: square_32
    dynamic_batch_size: true
    steps_per_epoch: auto
  dataloader:
    batch_size: 128
    num_workers: 4
    shuffle: true
    drop_last: true
    pin_memory: true
    persistent_workers: true
  splits:
    mode: random_holdout
    validation_size: 10000

model:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 64
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

diffusion:
  name: ddpm
  noise_schedule:
    name: linear_beta
    params:
      num_timesteps: 1000
      beta_start: 0.0001
      beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0002
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

trainer:
  num_epochs: 20
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 5
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 1
