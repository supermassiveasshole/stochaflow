experiment:
  name: ddpm_cifar10
  seed: 42
  output_dir: outputs/ddpm_cifar10

data:
  dataset:
    name: cifar10
    params:
      root: ./data
      split: train
      image_size: 32
      channels: 3
      download: true
      normalize: true
      random_horizontal_flip: true
  dataloader:
    batch_size: 128
    num_workers: 4
    shuffle: true
    drop_last: true
    pin_memory: true
    persistent_workers: true
  splits:
    mode: random_holdout
    train_split: train
    validation_size: 5000
    test_split: test

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 128
    channel_multipliers: [1, 2, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

diffusion:
  name: ddpm
  scheduler:
    name: linear_ddpm
    params:
      num_timesteps: 1000
      beta_start: 0.0001
      beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0002
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

trainer:
  num_epochs: 100
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 10
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
