experiment:
  name: ddpm_cifar10
  seed: 42
  output_dir: outputs/ddpm_cifar10

extensions:
  modules: []

data:
  name: image
  params:
    source:
      kind: torchvision
      dataset: CIFAR10
      root: ./data
      download: true
    image:
      size: [32, 32]
      channels: 3
      normalize: true
      random_horizontal_flip: true
    loader:
      batch_size: 128
      num_workers: 4
      shuffle: true
      drop_last: true
      pin_memory: true
      persistent_workers: true
      steps_per_epoch: auto
    partition:
      mode: holdout
      validation_size: 5000

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 128
    channel_multipliers: [1, 2, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

diffusion:
  name: ddpm
  noise_schedule:
    name: linear_beta
    params:
      num_timesteps: 1000
      beta_start: 0.0001
      beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0002
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

sampling:
  sampler: null
  shape: [3, 32, 32]
  num_samples: 16
  batch_size: 16
  seed: null
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 4, gif_fps: 8, denormalize: true}
  debug:
    trajectory:
      enabled: false
      params: {}

trainer:
  num_epochs: 100
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 10
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
