experiment:
  name: ddpm_cifar10
  output_dir: outputs/ddpm_cifar10
  seed: 42

data:
  dataset: cifar10
  root: ./data
  image_size: 32
  channels: 3
  batch_size: 128
  num_workers: 4

model:
  base_channels: 128
  channel_multipliers: [1, 2, 2, 4]
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  dropout: 0.1
  time_embedding_dim: 256

diffusion:
  type: ddpm
  timesteps: 1000
  beta_schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  objective: pred_noise

training:
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  ema_decay: 0.9999
  log_every: 100
  sample_every: 5
  save_every: 5
