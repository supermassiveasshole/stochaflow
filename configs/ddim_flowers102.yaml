experiment:
  name: ddim_flowers102
  seed: 42
  output_dir: outputs/ddim_flowers102

data:
  modules: []
  datasets:
    - id: flowers102
      factory: flowers102
      params:
        root: ./data
        download: true
        random_horizontal_flip: true
      splits:
        train: train
        validation: val
        test: test
  image:
    channels: 3
    normalize: true
  batching:
    buckets:
      - name: square_64
        height: 64
        width: 64
    sample_bucket: square_64
    dynamic_batch_size: true
    steps_per_epoch: auto
  dataloader:
    batch_size: 64
    num_workers: 2
    shuffle: true
    drop_last: true
    pin_memory: true
    persistent_workers: false
  splits:
    mode: official

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 128
    channel_multipliers: [1, 2, 4, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1
    attention_levels: [2, 3]
    attention_heads: 4

diffusion:
  name: ddim
  params:
    num_inference_steps: 100
    eta: 0.0
    clip_denoised: true
  noise_schedule:
    name: linear_beta
    params:
      num_timesteps: 1000
      beta_start: 1.0e-4
      beta_end: 2.0e-2

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

lr_scheduler:
  name: warmup_cosine
  interval: step
  params:
    warmup_steps: 500
    total_steps: auto
    min_lr_ratio: 0.05

ema:
  enabled: true
  decay: 0.999
  update_after_step: 0
  update_every: 1
  use_for_sampling: true

sampling:
  sampler: null
  num_samples: 64
  batch_size: 16
  seed: null
  grid_nrow: 8
  debug:
    trajectory:
      enabled: false
      params: {}
      gif_fps: 8

diagnostics:
  - name: ddpm
    params:
      interval: 100
      timestep_buckets: 10
      sample_every_epochs: 5
      sample_num: 16
      sample_seed: 123
      sample_grid_size: 4
      reconstruction_every_epochs: 5
      reconstruction_timesteps: [50, 250, 500, 900]
      use_ema_for_artifacts: true

trainer:
  num_epochs: 700
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: false
    monitor: train_loss
    mode: min
    patience: 20
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
