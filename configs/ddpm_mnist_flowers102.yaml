experiment:
  name: ddpm_mnist_flowers102
  seed: 42
  output_dir: outputs/ddpm_mnist_flowers102

extensions:
  plugins: []

data:
  name: multi_resolution_image
  params:
    sources:
    - id: digits
      sampling_weight: 0.4
      source:
        name: torchvision
        params:
          dataset: MNIST
        materialization:
          cache_root: ./data
          policy: ensure
          verification: full
    - id: flowers
      sampling_weight: 0.6
      source:
        name: torchvision
        params:
          dataset: Flowers102
        materialization:
          cache_root: ./data
          policy: ensure
          verification: full
    image:
      channels: 3
      normalize: true
      random_horizontal_flip: true
    batching:
      buckets:
      - name: square_32
        height: 32
        width: 32
      - name: square_64
        height: 64
        width: 64
      base_bucket: square_64
      dynamic_batch_size: true
    loader:
      batch_size: 64
      num_workers: 4
      shuffle: true
      drop_last: true
      pin_memory: false
      persistent_workers: true
      steps_per_epoch: auto
    partition:
      mode: holdout
      validation_size: 0.1

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 128
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

process:
  name: discrete_gaussian
  params:
    schedule:
      name: linear_beta
      params:
        num_timesteps: 1000
        beta_start: 0.0001
        beta_end: 0.02

training:
  name: gaussian_denoising
  params:
    prediction_type: epsilon

objective:
  name: mse
  params:
    reduction: mean

optimizer:
  name: torch.optim.Adam
  params:
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

sampling:
  shape: [3, 64, 64]
  num_samples: 16
  batch_size: 16
  seed: null
  builder:
    name: standard_denoising
    params:
      weights: auto
      prediction_type: epsilon
      clip_denoised: true
      sampler: {name: ddpm, params: {}}
      trajectory: {enabled: false, every_steps: 1}
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 4, gif_fps: 8, denormalize: true}

trainer:
  num_epochs: 200
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 10
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
