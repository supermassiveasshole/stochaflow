experiment:
  name: ddpm_mnist_flowers102
  seed: 42
  output_dir: outputs/ddpm_mnist_flowers102

extensions:
  modules: []

data:
  name: multi_resolution_image
  params:
    datasets:
    - id: digits
      factory: mnist
      sampling_weight: 0.4
      params:
        root: ./data
        download: true
      splits:
        train: train
        test: test
    - id: flowers
      factory: flowers102
      sampling_weight: 0.6
      params:
        root: ./data
        download: true
        random_horizontal_flip: true
      splits:
        train: train
        test: test
    image:
      channels: 3
      normalize: true
    batching:
      buckets:
      - name: square_32
        height: 32
        width: 32
      - name: square_64
        height: 64
        width: 64
      base_bucket: square_64
      dynamic_batch_size: true
    dataloader:
      batch_size: 64
      num_workers: 4
      shuffle: true
      drop_last: true
      pin_memory: true
      persistent_workers: true
      steps_per_epoch: auto
    splits:
      mode: random_holdout
      validation_size: 0.1

model:
  name: unet
  params:
    in_channels: 3
    out_channels: 3
    base_channels: 128
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    time_embedding_dim: 128
    dropout: 0.1

diffusion:
  name: ddpm
  params:
    clip_denoised: true
  noise_schedule:
    name: linear_beta
    params:
      num_timesteps: 1000
      beta_start: 0.0001
      beta_end: 0.02

objective:
  name: ddpm_epsilon
  params:
    reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

sampling:
  sampler: null
  shape: [3, 64, 64]
  num_samples: 16
  batch_size: 16
  seed: null
  writers:
    - name: tensor
      params: {}
    - name: image
      params: {grid_nrow: 4, gif_fps: 8, denormalize: true}
  debug:
    trajectory:
      enabled: false
      params: {}

trainer:
  num_epochs: 100
  device: auto
  max_grad_norm: 1.0
  show_progress: true
  early_stopping:
    enabled: true
    monitor: valid_loss
    mode: min
    patience: 10
    min_delta: 0.0

logging:
  log_every: 100
  backends:
    - name: local
      params:
        console: false
        append: false
  torch_logs: {}

artifacts:
  checkpoint_every: 5
