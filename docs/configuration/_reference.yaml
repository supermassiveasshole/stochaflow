schema_version: 1

fields:
  experiment: {description: 实验标识、随机性和输出位置。}
  experiment.name: {description: 人类可读的实验名称，用于日志 run name。}
  experiment.seed: {description: 数据划分、采样器、训练与采样的基础随机种子。}
  experiment.output_dir: {description: 运行目录根路径；训练会在其下创建时间戳子目录。, cli: "train --output-dir"}
  experiment.exp_id: {description: 运行实例标识；通常由 runner 在创建时间戳目录后写入。}

  extensions: {description: 从当前 Python 环境选择并激活标准 entry-point Registry 扩展。}
  extensions.plugins: {description: 要加载的 stochaflow.extensions entry-point 名称；null 选择当前环境中的全部插件。, constraints: 非 null 时为无重复的非空名称列表；空列表禁用第三方插件。}

  data: {description: 由 data_builders Registry 构建的一次训练运行数据入口。}
  data.name: {description: data_builders Registry 名称。}
  data.params: {description: DataBuilder 完整拥有的参数；核心不解释 Dataset、split、sampler、collate 或 batch 语义。}

  model: {description: 由 models Registry 构建的 primary inference/training model。}
  model.name: {description: models Registry 名称。}
  model.params: {description: 模型构造参数；内置参数见 Registry 组件索引。}
  training: {description: 由 training_builders Registry 组装 TrainingPlan 的训练任务声明。}
  training.name: {description: training_builders Registry 名称。}
  training.params: {description: TrainingBuilder 独占的组合参数；核心不解释多模型、condition 或 target 语义。}
  process: {description: 可选的 model-free、可迁移且可 checkpoint 的 probability process 声明；null 表示算法不需要 Process。}
  process.name: {description: processes Registry 名称。}
  process.params: {description: Process 构造参数；模型、condition 和 sampler 不进入此处。}
  objective: {description: 可选训练目标函数的 Registry 声明；具体 TrainingBuilder 决定是否需要。}
  objective.name: {description: objectives Registry 名称。}
  objective.params: {description: 目标函数构造参数。}
  optimizer: {description: 原生 PyTorch optimizer target 或 optimizers Registry 扩展声明。}
  optimizer.name: {description: 受限 torch.optim.<Class> target，或第三方 optimizers Registry 名称。}
  optimizer.params: {description: 原样透传给 optimizer 构造器的关键字参数；trainable parameters 由运行时注入。}
  lr_scheduler: {description: 可选原生 PyTorch/Registry LR scheduler target、构造参数及更新周期；null 禁用。}
  lr_scheduler.name: {description: 受限 torch.optim.lr_scheduler.<Class> target，或第三方 lr_schedulers Registry 名称。}
  lr_scheduler.interval: {description: 在每个 optimizer step 后或每个 epoch 后推进调度器。, constraints: 启用时为 step 或 epoch。}
  lr_scheduler.params: {description: 调度器构造参数；optimizer 由运行时注入。}
  ema: {description: 模型参数的指数移动平均策略。}
  ema.enabled: {description: 是否创建并更新 EMA 权重。}
  ema.decay: {description: 历史 EMA 权重的保留系数。, constraints: 大于等于零且小于一。}
  ema.update_after_step: {description: 在全局 step 达到该值后才开始更新 EMA。, constraints: 非负整数。}
  ema.update_every: {description: 每隔多少个 optimizer step 更新一次 EMA。, constraints: 正整数。}
  ema.use_for_sampling: {description: 采样和诊断 artifact 是否优先使用 EMA 权重。}
  sampling: {description: 独立采样和训练结束验收采样的默认设置。}
  sampling.builder: {description: 完整拥有采样装配和执行的 sampling_builders Registry 声明；null 禁用默认训练后采样。}
  sampling.builder.name: {description: sampling_builders Registry 名称。}
  sampling.builder.params: {description: Builder 独占参数；standard_denoising 在其中声明权重、prediction type、sampler 和 trajectory。}
  sampling.shape: {description: 单个生成 state 的形状，不含 batch 维；null 允许不需要固定 shape 的自定义运行时。, constraints: 非 null 时为非空正整数列表。}
  sampling.num_samples: {description: 一次采样生成的总样本数。, constraints: 正整数。}
  sampling.batch_size: {description: 采样时每批样本数，与 DataBuilder 独立。, constraints: 正整数。}
  sampling.seed: {description: 采样专用随机种子；null 使用 experiment.seed。}
  sampling.writers: {description: 按声明顺序运行的 sampling_artifact_writers 组件。, constraints: 至少一个。}
  "sampling.writers[].name": {description: sampling_artifact_writers Registry 名称。}
  "sampling.writers[].params": {description: writer 构造参数；图像网格与 GIF 参数属于 image writer。}
  diagnostics: {description: 训练期间按声明顺序实例化的 diagnostics Registry 组件列表。}
  "diagnostics[].name": {description: diagnostics Registry 名称。}
  "diagnostics[].params": {description: diagnostic 构造参数；logger、output_dir 与 sample_shape 由运行时注入。}
  trainer: {description: 训练循环、设备、梯度和早停配置。}
  trainer.num_epochs: {description: 每个独立 run 的最大训练 epoch 数。, constraints: 正整数。, cli: "train --epochs"}
  trainer.device: {description: Torch 设备字符串；auto 依次选择 CUDA、MPS、CPU。, cli: "train --device"}
  trainer.max_grad_norm: {description: 梯度范数裁剪阈值；null 禁用裁剪。, constraints: 非 null 时为正数。}
  trainer.show_progress: {description: 是否显示 Rich 进度条。, cli: "train --no-progress"}
  trainer.early_stopping: {description: 基于 epoch 指标的提前停止策略。}
  trainer.early_stopping.enabled: {description: 是否启用提前停止。}
  trainer.early_stopping.monitor: {description: 需要监控的 epoch 指标名，例如 valid_loss 或 train_loss。}
  trainer.early_stopping.mode: {description: min 表示越小越好，max 表示越大越好。, constraints: min 或 max。}
  trainer.early_stopping.patience: {description: 指标无足够改善时容忍的 epoch 数。, constraints: 正整数。}
  trainer.early_stopping.min_delta: {description: 被视为改善所需的最小绝对差值。, constraints: 非负数。}
  logging: {description: 指标记录频率、后端与 torch 内部日志配置。}
  logging.log_every: {description: 每隔多少个训练 step 写一次 step 指标。, constraints: 正整数。}
  logging.backends: {description: 按声明顺序组合的 logger Registry 组件。, constraints: 至少一个。}
  "logging.backends[].name": {description: loggers Registry 名称。}
  "logging.backends[].params": {description: logger 构造参数；output_dir 与 run_name 由运行时注入。}
  logging.torch_logs: {description: 传给 torch._logging.set_logs 的关键字；依赖当前 PyTorch 版本。}
  artifacts: {description: 训练 artifact 的保存频率。}
  artifacts.checkpoint_every: {description: 每隔多少个 epoch 保存编号 checkpoint；best 与 latest 仍按各自规则更新。, constraints: 正整数。}

registries:
  models:
    description: 构建 primary inference/training model。
    base: torch.nn.Module
    config_path: model.name / model.params
    entries:
      unet:
        description: 带时间嵌入、残差块和可选注意力的图像 UNet。
        parameters:
          in_channels: {description: 输入 state 的通道数；由所用模型和训练策略共同约定。}
          out_channels: {description: 输出预测的通道数；由所用模型和训练策略共同约定。}
          base_channels: {description: 第一层特征通道数。}
          channel_multipliers: {description: 每个分辨率层相对 base_channels 的通道倍数；长度决定下采样深度。}
          num_res_blocks: {description: 每个分辨率层的残差块数量。}
          time_embedding_dim: {description: 正弦时间嵌入和 MLP 的基础维度。}
          dropout: {description: 残差块 dropout 概率。}
          attention_levels: {description: 启用空间注意力的零起始分辨率层索引；null 禁用。}
          attention_heads: {description: 每个注意力块的 head 数。}

  data_builders:
    description: 直接组装 Dataset、划分、sampler、collate 和 loader，并返回单次运行的 DataLoaders。
    base: stochaflow.data.DataBuilder
    config_path: data.name / data.params
    entries:
      image:
        description: 单一 torchvision 或本地图像来源的标准图像 recipe。
        runtime_parameters: [context]
        inspect: context_parameters
        parameters:
          source: {description: "必填 mapping；规范结构为 `name`、`params`、`materialization`，未知字段拒绝。"}
          source.name: {description: "必填非空注册名；内置为 `torchvision`、`image_folder` 或 `paired_image_folders`（配对项仅供 super-resolution recipe）。"}
          source.params: {description: "source 私有 mapping；字段由所选 DataSource 严格验证。"}
          source.params.dataset: {description: "`torchvision` 时必填；`MNIST`、`CIFAR10` 或 `Flowers102`（大小写不敏感）。"}
          source.params.root: {description: "`image_folder` 时必填的本地/NFS 根目录。"}
          source.params.layout: {description: "folder source 布局；`flat` 递归读取单一根目录，`split` 读取 train/validation/test 子目录。"}
          source.materialization: {description: "必填 mapping；字段省略时使用 `cache_root: ./data`、`policy: ensure`、`verification: full`。"}
          source.materialization.cache_root: {description: "artifact/index 缓存根目录；默认 `./data`。"}
          source.materialization.policy: {description: "`ensure` 可创建 exact artifact，`require` 只接受已存在 artifact；默认 `ensure`。"}
          source.materialization.verification: {description: "`manifest` 校验索引与大小，`full` 重新校验全部内容；默认 `full`，strict resume 强制完整验证。"}
          image: {description: "必填 mapping；`size` 必填，其余字段使用下列默认值。"}
          image.size: {description: "必填 `[height, width]`；两个维度均为正整数。"}
          image.channels: {description: "输出通道数；默认 `3`，仅支持 `1` 或 `3`。"}
          image.normalize: {description: "是否将 `[0, 1]` 映射到 `[-1, 1]`；默认 `true`，必须为布尔值。"}
          image.random_horizontal_flip: {description: "训练时是否以 0.5 概率水平翻转；默认 `false`，必须为布尔值。"}
          partition.mode: {description: "划分模式；默认 `none`，支持 `none`、`official`、`holdout`、`kfold`。"}
          partition.validation_size: {description: "默认 `null`；`holdout` 时必填，可为 `(0, 1)` 比例或正整数，并须同时留下训练和验证样本；其他模式禁止。"}
          partition.num_folds: {description: "默认 `null`；`kfold` 时必填，至少为 2 且不得超过训练集大小；其他模式禁止。"}
          partition.fold_index: {description: "默认 `null`；`kfold` 时必填，范围为 `[0, num_folds)`；其他模式禁止。"}
          loader.batch_size: {description: "训练 DataLoader batch size；默认 `128`，必须为正整数。"}
          loader.num_workers: {description: "DataLoader worker 数；默认 `4`，必须为非负整数。"}
          loader.shuffle: {description: "训练集是否按 `(seed, epoch)` 确定性 shuffle；默认 `true`，必须为布尔值。"}
          loader.drop_last: {description: "训练集是否丢弃不足一个 batch 的尾部；默认 `true`，必须为布尔值。"}
          loader.pin_memory: {description: "是否启用 DataLoader pinned memory；默认 `false`，必须为布尔值。CUDA 用户可显式开启，MPS 不支持 pinned memory。"}
          loader.persistent_workers: {description: "是否保持 worker；默认 `true`，必须为布尔值，启用时 `num_workers > 0`。"}
          loader.prefetch_factor: {description: "每个 worker 的预取因子；配置默认 `null`（不覆盖 PyTorch 默认值），非 null 时为正整数且要求 `num_workers > 0`。"}
          loader.steps_per_epoch: {description: "训练 epoch 的显式 batch 上限；默认 `auto`（使用 loader 长度），或填写正整数且不得超过 sized loader 长度。"}
      multi_resolution_image:
        description: 多源加权混合、resolution bucket 与动态像素预算 batch 的图像 recipe。
        runtime_parameters: [context]
        inspect: context_parameters
        parameters:
          sources: {description: "必填的非空 source mapping 列表；每项只接受下列字段。"}
          "sources[].id": {description: "每个来源必填的非空唯一标识。"}
          "sources[].sampling_weight": {description: "默认 `null`；若任一来源设置，则所有来源都必须设置有限正数权重，无需归一化为和 1。"}
          "sources[].source.name": {description: "必填非空注册名；内置为 `torchvision` 或 `image_folder`。"}
          "sources[].source.params": {description: "source 私有 mapping；字段由所选 DataSource 严格验证。"}
          "sources[].source.params.dataset": {description: "`torchvision` 时必填；`MNIST`、`CIFAR10` 或 `Flowers102`（大小写不敏感）。"}
          "sources[].source.params.root": {description: "`image_folder` 时必填的本地/NFS 根目录。"}
          "sources[].source.params.layout": {description: "folder source 布局；`flat` 或 `split`。"}
          "sources[].source.materialization": {description: "必填 mapping；字段省略时使用 `cache_root: ./data`、`policy: ensure`、`verification: full`。"}
          "sources[].source.materialization.cache_root": {description: "artifact/index 缓存根目录；默认 `./data`。"}
          "sources[].source.materialization.policy": {description: "`ensure` 或 `require`；默认 `ensure`。"}
          "sources[].source.materialization.verification": {description: "`manifest` 或 `full`；默认 `full`，strict resume 强制完整验证。"}
          image: {description: "必填 mapping；内部字段均使用下列默认值。"}
          image.channels: {description: "输出通道数；默认 `3`，仅支持 `1` 或 `3`。"}
          image.normalize: {description: "是否将 `[0, 1]` 映射到 `[-1, 1]`；默认 `true`，必须为布尔值。"}
          image.random_horizontal_flip: {description: "训练时是否以 0.5 概率水平翻转；默认 `false`，必须为布尔值。"}
          batching: {description: "必填 mapping；声明非空 buckets、base bucket 和动态 batch 策略。"}
          batching.buckets: {description: "必填的非空 bucket mapping 列表。"}
          "batching.buckets[].name": {description: "每个 bucket 的必填非空唯一名称。"}
          "batching.buckets[].height": {description: "bucket 高度；必填正整数。"}
          "batching.buckets[].width": {description: "bucket 宽度；必填正整数。"}
          batching.base_bucket: {description: "必填；必须命名 `batching.buckets` 中的一个 bucket，其像素量定义基础 batch 预算。"}
          batching.dynamic_batch_size: {description: "是否按 bucket 像素量调整 batch size；默认 `true`，必须为布尔值。"}
          partition.mode: {description: "划分模式；默认 `none`，支持 `none`、`official`、`holdout`、`kfold`；任一组合 role 必须由全部 source 提供或全部不提供。"}
          partition.validation_size: {description: "默认 `null`；`holdout` 时必填，可为 `(0, 1)` 比例或正整数，并须同时留下训练和验证样本；其他模式禁止。"}
          partition.num_folds: {description: "默认 `null`；`kfold` 时必填，至少为 2 且不得超过训练集大小；其他模式禁止。"}
          partition.fold_index: {description: "默认 `null`；`kfold` 时必填，范围为 `[0, num_folds)`；其他模式禁止。"}
          loader.batch_size: {description: "基础 batch size；默认 `128`，必须为正整数。"}
          loader.num_workers: {description: "DataLoader worker 数；默认 `4`，必须为非负整数。"}
          loader.shuffle: {description: "训练 batch 是否按 `(seed, epoch)` 确定性 shuffle；默认 `true`，必须为布尔值。"}
          loader.drop_last: {description: "训练集是否丢弃不足 bucket batch 的尾部；默认 `true`，必须为布尔值。"}
          loader.pin_memory: {description: "是否启用 DataLoader pinned memory；默认 `false`，必须为布尔值。CUDA 用户可显式开启，MPS 不支持 pinned memory。"}
          loader.persistent_workers: {description: "是否保持 worker；默认 `true`，必须为布尔值，启用时 `num_workers > 0`。"}
          loader.prefetch_factor: {description: "每个 worker 的预取因子；配置默认 `null`（不覆盖 PyTorch 默认值），非 null 时为正整数且要求 `num_workers > 0`。"}
          loader.steps_per_epoch: {description: "训练 epoch 的 batch 数；默认 `auto`（自然 bucket batch 数），或填写正整数。"}
      super_resolution:
        description: 从 HR 在线生成 LR 或读取配对目录的图像超分 recipe。
        runtime_parameters: [context]
        inspect: context_parameters
        parameters:
          source: {description: "必填 mapping；规范结构为 `name`、`params`、`materialization`，未知字段拒绝。"}
          source.name: {description: "在线模式为 `torchvision` 或 `image_folder`，配对模式为 `paired_image_folders`，并必须与 `low_resolution.kind` 一致。"}
          source.params: {description: "source 私有 mapping；字段由所选 DataSource 严格验证。"}
          source.params.dataset: {description: "`torchvision` 时必填；`MNIST`、`CIFAR10` 或 `Flowers102`（大小写不敏感）。"}
          source.params.root: {description: "`image_folder` 时必填的 HR 根目录。"}
          source.params.high_resolution_root: {description: "`paired_image_folders` 时必填的 HR 根目录。"}
          source.params.low_resolution_root: {description: "`paired_image_folders` 时必填的 LR 根目录；与 HR 按相对路径 stem 配对。"}
          source.params.layout: {description: "folder source 布局；`flat` 或 `split`。"}
          source.materialization: {description: "必填 mapping；字段省略时使用 `cache_root: ./data`、`policy: ensure`、`verification: full`。"}
          source.materialization.cache_root: {description: "artifact/index 缓存根目录；默认 `./data`。"}
          source.materialization.policy: {description: "`ensure` 或 `require`；默认 `ensure`。"}
          source.materialization.verification: {description: "`manifest` 或 `full`；默认 `full`，strict resume 强制完整验证。"}
          image: {description: "必填 mapping；HR/LR size 必填，其余字段使用下列默认值。"}
          image.high_resolution: {description: "必填 HR `[height, width]`；两个维度均为正整数。"}
          image.low_resolution: {description: "必填 LR `[height, width]`；两个维度均为正整数；bicubic 模式要求每轴 LR 不大于 HR，paired 模式要求每轴 HR/LR 缩放比为整数。"}
          image.channels: {description: "HR/LR 输出通道数；默认 `3`，仅支持 `1` 或 `3`。"}
          image.normalize: {description: "是否将 HR/LR 从 `[0, 1]` 映射到 `[-1, 1]`；默认 `true`，必须为布尔值。"}
          image.random_horizontal_flip: {description: "训练时是否对 HR/LR 同步水平翻转；默认 `false`，必须为布尔值。"}
          low_resolution.kind: {description: "LR 来源；默认 `bicubic`，支持 `bicubic` 或 `paired`。"}
          partition.mode: {description: "划分模式；默认 `none`，支持 `none`、`official`、`holdout`、`kfold`。"}
          partition.validation_size: {description: "默认 `null`；`holdout` 时必填，可为 `(0, 1)` 比例或正整数，并须同时留下训练和验证样本；其他模式禁止。"}
          partition.num_folds: {description: "默认 `null`；`kfold` 时必填，至少为 2 且不得超过训练集大小；其他模式禁止。"}
          partition.fold_index: {description: "默认 `null`；`kfold` 时必填，范围为 `[0, num_folds)`；其他模式禁止。"}
          loader.batch_size: {description: "训练 DataLoader batch size；默认 `128`，必须为正整数。"}
          loader.num_workers: {description: "DataLoader worker 数；默认 `4`，必须为非负整数。"}
          loader.shuffle: {description: "训练集是否按 `(seed, epoch)` 确定性 shuffle；默认 `true`，必须为布尔值。"}
          loader.drop_last: {description: "训练集是否丢弃不足一个 batch 的尾部；默认 `true`，必须为布尔值。"}
          loader.pin_memory: {description: "是否启用 DataLoader pinned memory；默认 `false`，必须为布尔值。CUDA 用户可显式开启，MPS 不支持 pinned memory。"}
          loader.persistent_workers: {description: "是否保持 worker；默认 `true`，必须为布尔值，启用时 `num_workers > 0`。"}
          loader.prefetch_factor: {description: "每个 worker 的预取因子；配置默认 `null`（不覆盖 PyTorch 默认值），非 null 时为正整数且要求 `num_workers > 0`。"}
          loader.steps_per_epoch: {description: "训练 epoch 的显式 batch 上限；默认 `auto`（使用 loader 长度），或填写正整数且不得超过 sized loader 长度。"}

  sampling_artifact_writers:
    description: 将生成 batch 写成模态相关 artifact，并返回已存在的文件路径。
    base: stochaflow.sampling.SamplingArtifactWriter
    config_path: sampling.writers[].name / sampling.writers[].params
    entries:
      tensor:
        description: 保存 samples.pt 和可选 trajectory.pt。
        parameters: {}
      image:
        description: 校验 NCHW 图像并保存 PNG、trajectory grid 和 GIF。
        parameters:
          grid_nrow: {description: 图像网格每行样本数。}
          gif_fps: {description: trajectory GIF 帧率。}
          denormalize: {description: 写图前是否将负一到一映射为零到一。}

  noise_schedules:
    description: 定义前向噪声路径以及离散 VP 系数。
    base: stochaflow.processes.GaussianNoiseSchedule
    config_path: process.params.schedule
    entries:
      cosine_alpha_bar:
        description: 通过余弦 alpha_bar 曲线离散化得到 beta 序列。
        parameters:
          num_timesteps: {description: 离散扩散步数；必填正整数。}
          s: {description: 余弦曲线起点偏移；默认 0.008。}
          max_beta: {description: 单步 beta 上限；默认 0.999。}
          dtype: {description: 系数 Tensor dtype；仅建议在 Python 配置中使用，YAML 保持默认。}
      linear_beta:
        description: 在 beta_start 与 beta_end 之间线性插值。
        parameters:
          num_timesteps: {description: 离散扩散步数；必填正整数。}
          beta_start: {description: 第一步 beta；默认 0.0001。}
          beta_end: {description: 最后一步 beta；默认 0.02。}
          dtype: {description: 系数 Tensor dtype；仅建议在 Python 配置中使用，YAML 保持默认。}

  processes:
    description: 按算法需要构建不持有模型且不执行采样循环的 probability process。
    base: stochaflow.processes.Process
    config_path: process.name / process.params
    entries:
      discrete_gaussian:
        description: 从构造期 schedule 固定 coefficient snapshot，并提供 marginal 与 adjacent posterior 的离散 Gaussian process。
        parameters:
          schedule: {description: noise_schedules Registry 的组件声明。}

  samplers:
    description: 在与算法 family 兼容的 Dynamics 和 initial state 上执行完整 solver 生命周期。
    base: stochaflow.sampling.Sampler
    config_path: sampling.builder.params.sampler 或自定义 SamplingBuilder 参数
    entries:
      ddim:
        description: 支持非均匀 state schedule 与 eta 随机性的 DDIM solver；具体类公开 schedule resolver 与 selected-pair transition primitive。
        parameters:
          num_inference_steps: {description: 自动生成 schedule 时的外层 transition 数。}
          schedule: {description: 可选、位于零到 T 且严格递减的显式 state schedule；可表达局部降噪。}
          eta: {description: 随机性系数；0 不消费 transition RNG。}
      ddpm:
        description: 在离散 Gaussian dynamics 上执行 adjacent ancestral transition；具体类公开同一 adjacent transition primitive。
        parameters:
          start_time: {description: 可选起始 state time；null 使用 process terminal time。}
          end_time: {description: 结束 state time；默认 0。}

  sampling_builders:
    description: 装配 initial state、模型、Dynamics、Sampler、observer 和 writer-ready batch。
    base: stochaflow.sampling.SamplingBuilder
    config_path: sampling.builder.name / sampling.builder.params
    entries:
      standard_denoising:
        description: 固定 Tensor shape 的标准 Gaussian denoising sampling recipe；要求 sampling.shape、离散 Gaussian Process，以及返回 Tensor 的 model(state, model_time)。
        runtime_parameters: [context]
        inspect: context_parameters
        parameters:
          weights: {description: "模型权重选择；默认 `auto`，支持 `auto`、`raw`、`ema`；选择 `ema` 时 checkpoint 必须含 EMA state。"}
          prediction_type: {description: "模型输出参数化；默认 `epsilon`，支持 `epsilon`、`x0`、`v`、`score`。"}
          clip_denoised: {description: "是否把预测 clean state 裁剪到 `[-1, 1]`；默认 `true`，必须为布尔值。"}
          sampler.name: {description: "必填的 samplers Registry 名称；Sampler 必须兼容离散 Gaussian Dynamics，并在此 Builder 中发出 terminal-to-clean 的完整 observation lifecycle；partial 路径需自定义 Builder。"}
          sampler.params: {description: "传给所选 Sampler 构造器的 mapping；默认 `{}`。"}
          trajectory.enabled: {description: "是否保留 trajectory observations；默认 `false`，必须为布尔值。"}
          trajectory.every_steps: {description: "trajectory 的 accepted-step 保留间隔；默认 `1`，必须为正整数；initial/final 始终保留。"}

  training_builders:
    description: 组装 primary model、可选 Process/Objective、TrainingStrategy 和辅助训练资产。
    base: stochaflow.training.TrainingBuilder
    config_path: training.name / training.params
    entries:
      gaussian_denoising:
        description: 使用离散 Gaussian marginal 和指定 prediction target 训练无条件去噪模型；batch 必须为 Tensor 或 (Tensor, {})。
        runtime_parameters: [context]
        inspect: context_parameters
        parameters:
          prediction_type: {description: "训练 target 与模型输出参数化；默认 `epsilon`，支持 `epsilon`、`x0`、`v`、`score`；要求注入离散 Gaussian Process 和 Objective。"}
      supervised:
        description: 对标准 inputs/targets batch 执行模型 forward 与注入的 Objective。
        runtime_parameters: [context]
        inspect: context_parameters
        parameters: {}
        parameter_note: "`params` 必须是空 mapping（默认 `{}`）；未知字段会被拒绝。该 Builder 要求注入 Objective，batch 必须为 `(inputs, targets)`，且 target 与模型输出都必须为 Tensor。"

  objectives:
    description: 将 Strategy 已定义语义的 prediction/target 转换为标量训练损失。
    base: torch.nn.Module
    config_path: objective.name / objective.params
    entries:
      mse:
        description: 可跨 supervised、Gaussian 和自定义 Strategy 复用的均方误差。
        parameters:
          reduction: {description: MSE 标量聚合方式；支持 mean 或 sum。}

  optimizers:
    description: 构建第三方 PyTorch Optimizer 扩展；标准 torch.optim 类通过受限原生 provider 解析，不复制为 Registry entry。
    base: torch.optim.Optimizer
    config_path: optimizer.name / optimizer.params
    entries: {}

  lr_schedulers:
    description: 构建第三方或 Stochaflow 自有 LR scheduler；标准 torch.optim.lr_scheduler 类通过受限原生 provider 解析，不复制为 Registry entry。
    base: torch.optim.lr_scheduler.LRScheduler
    config_path: lr_scheduler.name / lr_scheduler.params
    entries:
      warmup_cosine:
        description: 项目内置的线性 warmup 加余弦衰减 LRScheduler。
        runtime_parameters: [optimizer]
        parameters:
          warmup_steps: {description: 线性 warmup 的正 step 数。}
          total_steps: {description: 显式总 step 数；必须大于 warmup_steps。}
          min_lr_ratio: {description: 最终学习率相对基础学习率的比例，范围为零到一。}
          last_epoch: {description: 恢复或手动初始化时使用的最后 step 索引；默认 -1。}

  loggers:
    description: 记录配置、指标、文本和图像 artifact。
    base: stochaflow.utils.logging.ExperimentLogger
    config_path: logging.backends[].name / logging.backends[].params
    entries:
      local:
        description: 写入终端、train.log 和 metrics.jsonl 的本地 logger。
        runtime_parameters: [output_dir, run_name]
        parameters:
          console: {description: 是否同时输出到终端。}
          text_filename: {description: 文本日志文件名。}
          metrics_filename: {description: JSONL 指标文件名。}
          append: {description: 是否追加本次 run 目录中已存在的 local 文件；strict resume 不会用它续写旧 run。}
      tensorboard:
        description: 将指标和图像写入 TensorBoard event 文件。
        runtime_parameters: [output_dir, run_name]
        parameters:
          subdir: {description: 运行目录内的 TensorBoard 子目录。}
      wandb:
        description: 将运行同步到 Weights & Biases；需要安装 wandb extra。
        runtime_parameters: [output_dir, run_name]
        parameters:
          project: {description: W&B project 名称。}
          entity: {description: W&B entity；null 使用当前默认。}
          mode: {description: W&B 模式，例如 online、offline 或 disabled。}
          tags: {description: run tag 列表。}

  diagnostics:
    description: 训练期间按周期记录 denoiser 指标并比较多个 sampler 的质量与 artifact。
    base: stochaflow.training.diagnostics.TrainingDiagnostic
    config_path: diagnostics[].name / diagnostics[].params
    entries:
      diffusion_quality:
        description: 通过可插拔 provider 记录 denoiser 指标，并在固定噪声下比较多个 sampler profile。
        runtime_parameters: [logger, output_dir, sample_shape]
        parameters:
          samplers: {description: sampler profile 列表；每项声明唯一 id、Registry name、构造 params 和可选 trajectory。}
          modules: {description: 按声明顺序导入并注册第三方 diagnostic provider 的 Python module。}
          cadence: {description: step metric 与 epoch artifact 的执行周期。}
          sampling: {description: 多 profile 共用的样本数、batch size 和基础 seed。}
          providers: {description: step metric、sampler metric、denoiser artifact 与 sampler artifact provider 列表。}
          reference: {description: 可选参考指标 provider、周期、真实/生成样本数和 batch size。}
          use_ema: {description: diagnostic 推理是否优先使用 EMA 权重。}
          failure_policy: {description: 运行期错误采用 raise 或 warn；配置错误始终失败。}

cli:
  "train.--config": {description: 新训练使用的完整实验 YAML；与 --resume 互斥且二者必须提供一个。}
  "train.--device": {description: 本次运行覆盖 trainer.device。}
  "train.--output-dir": {description: 本次运行覆盖 experiment.output_dir。}
  "train.--epochs": {description: 本次运行覆盖 trainer.num_epochs。}
  "train.--limit-batches": {description: 每个 epoch 最多执行的训练 batch 数，用于 smoke/debug。}
  "train.--limit-validation-batches": {description: 每个 epoch 最多执行的验证 batch 数。}
  "train.--limit-test-batches": {description: 最终测试最多执行的 batch 数。}
  "train.--deterministic": {description: 启用 PyTorch 严格确定性算法；没有确定性实现的算子会报错。}
  "train.--no-progress": {description: 禁用 Rich 进度条。}
  "train.--resume": {description: 从显式 checkpoint 文件或运行目录执行严格完整恢复；使用 checkpoint 保存的配置和训练状态，并与 --config 互斥。}
  "train.--observability-config": {description: 仅在 strict resume 启动时原子替换 diagnostics，并逐字段覆盖显式 logging 字段；顶层只允许 diagnostics 与 logging。}
  "train.--skip-final-sample": {description: 跳过训练完成后的最佳 checkpoint 验收采样。}
  "train.--force-extension-version-mismatch": {description: 在插件身份匹配后接受版本差异；不绕过 checkpoint state 兼容性检查。}
  "sample.--config": {description: 可选完整外部配置（整体权威），或在显式 checkpoint 上应用的 sampling/extensions 轻量 overlay。}
  "sample.--checkpoint": {description: checkpoint 文件或运行目录；仅给 config 时自动查找最新 best.pt。}
  "sample.--device": {description: 覆盖采样设备。}
  "sample.--output-dir": {description: 覆盖生成 artifact 的目录。}
  "sample.--force-extension-version-mismatch": {description: 在插件身份匹配后接受版本差异；不绕过 checkpoint state 兼容性检查。}
  "init.NAME": {description: 新项目目录、distribution 和 extension entry-point 使用的 canonical ASCII slug。}
